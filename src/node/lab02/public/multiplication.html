<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แม่สูตรคูณ - Lab 02</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>

<body class="bg-zinc-50 text-zinc-800 min-h-screen antialiased flex flex-col justify-center p-4 sm:p-8">
    <div class="w-full max-w-md mx-auto">
        <!-- Back Link -->
        <div class="mb-4">
            <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-medium text-zinc-500 hover:text-zinc-900 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>กลับสู่หน้าหลัก</span>
            </a>
        </div>

        <!-- Main Card -->
        <div class="bg-white rounded-xl border border-zinc-200 shadow-sm p-6 sm:p-8">
            <!-- Header -->
            <div class="mb-6">
                <span class="inline-block px-2 py-0.5 rounded bg-zinc-100 text-zinc-600 text-xs font-medium mb-2">
                    โปรแกรมที่ 03
                </span>
                <h1 class="text-xl font-bold text-zinc-900">โปรแกรมแม่สูตรคูณ</h1>
                <p class="text-xs text-zinc-500 mt-1">แสดงตารางสูตรคูณตั้งแต่ลำดับที่ 1 ถึง 12 ตามแม่ที่ต้องการ</p>
            </div>

            <!-- Form -->
            <form action="/multiplication" method="POST" class="space-y-4">
                <div>
                    <label for="num" class="block text-xs font-medium text-zinc-700 mb-1.5">
                        ป้อนแม่สูตรคูณ (ตัวเลข)
                    </label>
                    <input type="number" id="num" name="num" min="1" max="1000" placeholder="เช่น 2, 9, 12, 25" required
                        class="w-full px-3.5 py-2.5 rounded-lg border border-zinc-300 text-zinc-900 placeholder-zinc-400 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-transparent transition-all">
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit"
                        class="w-full py-2.5 px-4 bg-zinc-900 hover:bg-zinc-800 text-white text-sm font-medium rounded-lg transition-colors shadow-sm">
                        แสดงตารางสูตรคูณ
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ปรับ Form Action ไปที่ Node.js Express Server (Port 3000) อัตโนมัติหากเปิดผ่าน Live Server
        const form = document.querySelector('form');
        if (form && window.location.port && window.location.port !== '3000') {
            form.action = 'http://localhost:3000' + form.getAttribute('action');
        }
    </script>
</body>

</html>
