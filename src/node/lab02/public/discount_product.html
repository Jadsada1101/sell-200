<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำนวณส่วนลดสินค้า - Lab 02</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>

<body class="bg-zinc-50 text-zinc-800 min-h-screen antialiased flex flex-col justify-center p-4 sm:p-8">
    <div class="w-full max-w-lg mx-auto">
        <!-- Back Link -->
        <div class="mb-4">
            <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-medium text-zinc-500 hover:text-zinc-900 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>กลับสู่หน้าหลัก</span>
            </a>
        </div>

        <!-- Main Card -->
        <div class="bg-white rounded-xl border border-zinc-200 shadow-sm p-6 sm:p-8">
            <!-- Header -->
            <div class="mb-6">
                <span class="inline-block px-2 py-0.5 rounded bg-zinc-100 text-zinc-600 text-xs font-medium mb-2">
                    โปรแกรมที่ 02
                </span>
                <h1 class="text-xl font-bold text-zinc-900">คำนวณส่วนลดสินค้า</h1>
                <p class="text-xs text-zinc-500 mt-1">คำนวณมูลค่าส่วนลดและราคาสุทธิที่ต้องชำระตามขั้นราคาสินค้า</p>
            </div>

            <!-- Discount Criteria Table -->
            <div class="mb-6">
                <h2 class="text-xs font-semibold text-zinc-700 uppercase tracking-wider mb-2">เกณฑ์การให้ส่วนลด</h2>
                <div class="overflow-hidden rounded-lg border border-zinc-200">
                    <table class="w-full text-xs text-left">
                        <thead class="bg-zinc-50 border-b border-zinc-200 text-zinc-600 font-medium">
                            <tr>
                                <th class="py-2.5 px-3.5">ราคาสินค้า (บาท)</th>
                                <th class="py-2.5 px-3.5 text-right">อัตราส่วนลด</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-zinc-100 text-zinc-700">
                            <tr>
                                <td class="py-2 px-3.5">1 - 5,000 บาท</td>
                                <td class="py-2 px-3.5 text-right font-medium text-zinc-400">0% (ไม่มีส่วนลด)</td>
                            </tr>
                            <tr>
                                <td class="py-2 px-3.5">5,001 - 10,000 บาท</td>
                                <td class="py-2 px-3.5 text-right font-semibold text-zinc-900">3%</td>
                            </tr>
                            <tr>
                                <td class="py-2 px-3.5">มากกว่า 10,000 บาท ขึ้นไป</td>
                                <td class="py-2 px-3.5 text-right font-semibold text-emerald-700">5%</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Form -->
            <form action="/discount_product" method="POST" class="space-y-4">
                <!-- Customer Name -->
                <div>
                    <label for="customerName" class="block text-xs font-medium text-zinc-700 mb-1.5">
                        ชื่อลูกค้า / ผู้ซื้อ
                    </label>
                    <input type="text" id="customerName" name="customerName" placeholder="เช่น นายวิทยา หรือ ลูกค้าทั่วไป" required
                        class="w-full px-3.5 py-2.5 rounded-lg border border-zinc-300 text-zinc-900 placeholder-zinc-400 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-transparent transition-all">
                </div>

                <!-- Product Price -->
                <div>
                    <label for="price" class="block text-xs font-medium text-zinc-700 mb-1.5">
                        ราคาสินค้า (บาท)
                    </label>
                    <div class="relative">
                        <input type="number" step="any" min="0" id="price" name="price" placeholder="เช่น 7500" required
                            class="w-full px-3.5 py-2.5 pr-12 rounded-lg border border-zinc-300 text-zinc-900 placeholder-zinc-400 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-transparent transition-all">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-xs text-zinc-400">
                            บาท
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit"
                        class="w-full py-2.5 px-4 bg-zinc-900 hover:bg-zinc-800 text-white text-sm font-medium rounded-lg transition-colors shadow-sm">
                        คำนวณส่วนลดและยอดสุทธิ
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ปรับ Form Action ไปที่ Node.js Express Server (Port 3000) อัตโนมัติหากเปิดผ่าน Live Server
        const form = document.querySelector('form');
        if (form && window.location.port && window.location.port !== '3000') {
            form.action = 'http://localhost:3000' + form.getAttribute('action');
        }
    </script>
</body>

</html>
