services:
  php-apache:
    image: php_apache
    container_name: sell200_php_apache
    volumes:
      - ./src:/var/www/html
    ports:
      - "8001:80"
    
  db:
    image: mysql:latest
    container_name: sell200_mysql
    volumes:
      - sell200_db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sell200_db
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin
    container_name: sell200_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  sell200_db_data: